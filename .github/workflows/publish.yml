name: 'Publish to npm'

env:
  INGITHUB: true

on:
  release:
    types: [created]

jobs:
  publish:
    runs-on: ubuntu-latest
    name: 'Publish ${{ github.ref_name }}'

    steps:
      - uses: actions/checkout@v3

      - name: Install LDAP tools
        run: sudo apt-get install -y ldap-utils

      - name: Start containers
        run: docker compose -f "docker-compose.yml" up -d

      - name: Wait for LDAP server to become available
        uses: nick-fields/retry@v2
        with:
          timeout_minutes: 5
          max_attempts: 10
          polling_interval_seconds: 3
          command: |
            ldapsearch -LLL -o 'ldif-wrap=no' \
              -H ldap://localhost:1389 \
              -D 'cn=read-only-admin,dc=example,dc=com' \
              -w password \
              -b 'cn=einstein,ou=users,dc=example,dc=com' DN

      - name: Use Node.js 22.x
        uses: actions/setup-node@v3
        with:
          node-version: 22.x
          registry-url: 'https://registry.npmjs.org'

      - run: npm ci
      - run: npm run test

      - name: Stop containers
        if: always()
        run: docker compose -f "docker-compose.yml" down

      - name: Publish to npm
        run: npm publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
