services:
  ldap-authentication:
    build:
      context: ..
      dockerfile: .devcontainer/Dockerfile
    volumes:
      - ..:/workspace:cached
    command: sleep infinity

  ldap:
    build:
      context: ..
      dockerfile: docker/ldap/Dockerfile
    ports:
      - '1389:389'
      - '1636:636'
    environment:
      - LDAP_DOMAIN=example.com
      - LDAP_ADMIN_PASSWORD=password
      - LDAP_TLS=true
